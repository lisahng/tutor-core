# Einstellungen der Weboberflaeche und der Studie.
#
# Alles, was zwischen Pilotlauf und Hauptstudie noch wandern koennte, steht hier.
# Nach einer Aenderung genuegt ein Neustart, kein Uebersetzen.

server.port=8080

# ---- Rahmen der Arbeitsphase ----
# Die Gesamtsitzung dauert 45 bis 60 Minuten. Davon entfaellt der hier gesetzte Teil auf
# das Ueben, der Rest auf Begruessung, Einverstaendniserklaerung, Vortest, Fragebogen und
# Interview. Was zuerst erreicht ist, Aufgabenzahl oder Zeit, beendet die Arbeitsphase.
tutor.aufgaben=20
tutor.arbeitszeit-minuten=25
tutor.versuche=3

# Fuer alle Teilnehmenden derselbe Startwert, damit auch dieselben Aufgaben entstehen.
tutor.seed=2026

# Ordner fuer die CSV-Protokolle, relativ zum Projektverzeichnis.
tutor.protokoll-ordner=protokolle

# ---- Technisches ----
# Eine Sitzung soll nicht mitten im Termin ablaufen.
server.servlet.session.timeout=2h

# Waehrend der Entwicklung werden Vorlagen nicht zwischengespeichert.
spring.thymeleaf.cache=false
