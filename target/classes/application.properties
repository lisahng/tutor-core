# Einstellungen der Weboberflaeche und der Studie.
#
# Alles, was zwischen Pilotlauf und Hauptstudie noch wandern koennte, steht hier.
# Nach einer Aenderung genuegt ein Neustart, kein Uebersetzen.

server.port=8080

# ---- Rahmen der Arbeitsphase ----
# Die Gesamtsitzung dauert 45 bis 60 Minuten. Davon entfaellt der hier gesetzte Teil auf
# das Ueben, der Rest auf Begruessung, Einverstaendniserklaerung, Vortest, Fragebogen und
# Interview. Was zuerst erreicht ist, Aufgabenzahl oder Zeit, beendet die Arbeitsphase.
tutor.aufgaben=30
tutor.arbeitszeit-minuten=20
tutor.versuche=3

# Fuer alle Teilnehmenden derselbe Startwert, damit auch dieselben Aufgaben entstehen.
tutor.seed=2026

# Ordner fuer die CSV-Protokolle, relativ zum Projektverzeichnis. Im Container muss das
# ein eingehaengtes Verzeichnis sein, sonst verschwinden die Dateien mit dem Container.
tutor.protokoll-ordner=protokolle

# Ob zusaetzlich CSV-Dateien geschrieben werden. Mit Datenbank bleibt das eingeschaltet,
# eine zweite unabhaengige Kopie kostet nichts.
tutor.csv-schreiben=true

# Schluessel fuer /export/protokoll.csv und /export/bewertungen.csv. Leer gibt den Export
# frei, was nur auf dem eigenen Rechner vertretbar ist. Im Betrieb kommt der Wert aus der
# Umgebungsvariable TUTOR_EXPORT_SCHLUESSEL.
tutor.export-schluessel=

# ---- Datenbank ----
# Ohne Profil laeuft die Anwendung ohne Datenbank und schreibt allein CSV-Dateien. Das ist
# der Normalfall auf dem eigenen Rechner. Die Selbsteinrichtung der Datenquelle wird dafuer
# abgeschaltet, denn sonst wuerde Spring Boot beim Start eine Verbindung verlangen, die es
# nicht gibt, und gar nicht erst hochfahren.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ---- Technisches ----
# Eine Sitzung soll nicht mitten im Termin ablaufen.
server.servlet.session.timeout=2h

# Waehrend der Entwicklung werden Vorlagen nicht zwischengespeichert.
spring.thymeleaf.cache=false
