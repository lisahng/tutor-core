# Betrieb mit der MariaDB des Lehrstuhls.
#
# Aktiviert durch das Profil "db", im Container ueber SPRING_PROFILES_ACTIVE=db. Ohne
# dieses Profil laeuft die Anwendung ohne Datenbank, was auf dem eigenen Rechner das
# Uebliche ist.

# Hebt die Abschaltung aus application.properties wieder auf.
spring.autoconfigure.exclude=

spring.datasource.url=${TUTOR_DB_URL:jdbc:mariadb://datenbank:3306/tutor}
spring.datasource.username=${TUTOR_DB_USER:tutor}
spring.datasource.password=${TUTOR_DB_PASSWORT:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Legt die beiden Tabellen beim Start an, falls sie fehlen. Spring Boot fuehrt schema.sql
# bei einer externen Datenbank nur dann aus, wenn das hier ausdruecklich steht.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Kleiner Verbindungspool. Mehr als eine Handvoll gleichzeitiger Sitzungen gibt es nicht,
# und jede schreibt nur ein paar Zeilen je Minute.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
