<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gesprächsblatt</title>
    <link rel="stylesheet" href="/stil.css">
</head>
<body>

<!--
    Ansicht fuer das Abschlussgespraech. Sie wird am Laptop gezeigt und soll aus zwei
    Metern Entfernung lesbar sein, deshalb die grossen Schriften und der viele Weissraum.
    Angezeigt wird ausschliesslich, was die teilnehmende Person waehrend der Bearbeitung
    ohnehin gesehen hat.

    Die Rueckmeldungstexte sind standardmaessig verdeckt und werden je Aufgabe einzeln
    aufgedeckt. Teil D des Leitfadens fragt, an welche Rueckmeldung sich die Person
    erinnert. Stuende der Wortlaut dabei auf dem Bildschirm, waehlte sie beim Lesen aus,
    statt sich zu erinnern, und gemessen waere die Verstaendlichkeit des Textes im
    ruhigen Nachlesen, nicht seine Wirkung waehrend der Bearbeitung.

    Deshalb auch blockweise und nicht fuer alle Aufgaben auf einmal: Wird in Teil B bei
    einer Aufgabe nachgeholfen, bleiben die noch nicht besprochenen Aufgaben verdeckt.
    Ein aufgedeckter Block behaelt die Marke "gezeigt", damit im Protokoll vermerkt
    werden kann, wo mit Hinweisreiz gearbeitet wurde.
-->
<div class="seite gespraech">

    <div class="kopf">
        <span class="fortschritt">Gesprächsblatt</span>
        <span class="kennung" th:text="${teilnehmer}">P01</span>
    </div>

    <p class="anweisung" th:if="${#lists.isEmpty(aufgaben)}">
        Zu dieser Sitzung liegen noch keine Eingaben vor.
    </p>

    <div class="aufgabenblock gespraechsblock verdeckt" th:each="a : ${aufgaben}"
         th:classappend="${mitRueckmeldung} ? 'offen' : ''">
        <p class="belegung" th:if="${a.hatBelegung()}">
            <span class="marke">gegeben</span>
            <span th:text="${a.belegung()}">s = "Java"</span>
        </p>

        <p class="ausdruck" th:text="${a.ausdruck()}">s.equals("Java")</p>

        <table class="eingaben">
            <thead>
            <tr>
                <th class="spalte-versuch">Versuch</th>
                <th class="spalte-eingabe">Eingabe</th>
                <th class="spalte-rueckmeldung">Rückmeldung</th>
                <th class="spalte-zeit">Dauer</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${a.eingaben()}" th:classappend="${e.lesbar()} ? '' : 'unlesbar'">
                <td class="spalte-versuch" th:text="${e.marke()}">1</td>
                <td class="spalte-eingabe" th:text="${e.antwort()}">"Java" : String</td>
                <td class="rueckmeldungstext" th:text="${e.rueckmeldung()}">Richtig!</td>
                <td class="spalte-zeit" th:text="|${e.sekunden()} s|">12 s</td>
            </tr>
            </tbody>
        </table>

        <p class="knopfzeile">
            <button type="button" class="rueckmeldung-knopf">Rückmeldung zeigen</button>
            <span class="gezeigt-marke" hidden>gezeigt</span>
        </p>
    </div>

</div>

<script>
    // Deckt die Rueckmeldungen eines einzelnen Aufgabenblocks auf. Die Marke "gezeigt"
    // bleibt danach stehen, auch wenn wieder zugeklappt wird, denn fuer die Auswertung
    // zaehlt, dass bei dieser Aufgabe mit Hinweisreiz gearbeitet wurde.
    (function () {
        document.querySelectorAll('.gespraechsblock').forEach(function (block) {
            var knopf = block.querySelector('.rueckmeldung-knopf');
            var marke = block.querySelector('.gezeigt-marke');
            if (!knopf) {
                return;
            }
            function beschrifte() {
                knopf.textContent = block.classList.contains('verdeckt')
                        ? 'Rückmeldung zeigen' : 'Rückmeldung ausblenden';
            }
            if (block.classList.contains('offen')) {
                block.classList.remove('verdeckt');
                if (marke) {
                    marke.hidden = false;
                }
            }
            beschrifte();
            knopf.addEventListener('click', function () {
                block.classList.toggle('verdeckt');
                if (!block.classList.contains('verdeckt') && marke) {
                    marke.hidden = false;
                }
                beschrifte();
            });
        });
    })();
</script>
</body>
</html>
